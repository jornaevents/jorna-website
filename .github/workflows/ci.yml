name: CI

# Two apps and the package they share, one repo. Each app is checked,
# previewed and deployed by app.yml — but only when a change touches it, so a
# vendor-only change doesn't rebuild the client app's checks. Since
# 2026-10-29 the vendor app's deploy (jornaevents.com) carries the client app
# at /client, so a client change runs the vendor job too; the client job's
# own deploy is book.jornaevents.com, which only redirects. Anything
# outside apps/ (packages/shared, this workflow, the root tooling) counts as
# touching both, and also runs the shared package's own checks.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Which apps changed
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.diff.outputs.client }}
      vendor: ${{ steps.diff.outputs.vendor }}
      shared: ${{ steps.diff.outputs.shared }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # No usable base (a first push, a force-push): check everything.
          if ! files=$(git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null); then
            printf 'client=true\nvendor=true\nshared=true\n' >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "$files"
          shared=$(echo "$files" | grep -v '^apps/' | grep -c . || true)
          if [ "$shared" -gt 0 ]; then echo "shared=true"; else echo "shared=false"; fi >> "$GITHUB_OUTPUT"
          for app in client vendor; do
            own=$(echo "$files" | grep -c "^apps/$app/" || true)
            # The vendor app's deploy also ships the client app at /client
            # (2026-10-29), so a client change has to rebuild and redeploy it.
            if [ "$app" = vendor ]; then own=$((own + $(echo "$files" | grep -c "^apps/client/" || true))); fi
            if [ "$own" -gt 0 ] || [ "$shared" -gt 0 ]; then echo "$app=true"; else echo "$app=false"; fi >> "$GITHUB_OUTPUT"
          done

  shared:
    name: Shared package
    needs: changes
    if: needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm --workspace @jorna/shared run lint
      - run: npm --workspace @jorna/shared run typecheck
      - run: npm --workspace @jorna/shared run test

  client:
    name: Client
    needs: changes
    if: needs.changes.outputs.client == 'true'
    uses: ./.github/workflows/app.yml
    with:
      app: client
      pages_project: jorna-events
      deploy_domain: https://jorna-events.pages.dev
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  vendor:
    name: Vendor
    needs: changes
    if: needs.changes.outputs.vendor == 'true'
    uses: ./.github/workflows/app.yml
    with:
      app: vendor
      pages_project: jorna-vendor
      deploy_domain: https://jorna-vendor.pages.dev
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  # Branch protection requires checks by these two names, from before the
  # apps shared a repo. Each passes when every app that ran passed — an app a
  # change didn't touch is skipped, which counts as fine.
  build-gate:
    name: Lint, typecheck, test, build
    needs: [changes, shared, client, vendor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.changes.result }}" "${{ needs.shared.result }}" "${{ needs.client.result }}" "${{ needs.vendor.result }}"; do
            case "$r" in success|skipped) ;; *) echo "a required job ended: $r"; exit 1 ;; esac
          done

  e2e-gate:
    name: E2E (Playwright)
    needs: [changes, shared, client, vendor]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          for r in "${{ needs.changes.result }}" "${{ needs.shared.result }}" "${{ needs.client.result }}" "${{ needs.vendor.result }}"; do
            case "$r" in success|skipped) ;; *) echo "a required job ended: $r"; exit 1 ;; esac
          done
