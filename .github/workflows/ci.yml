name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm run install:app

      - name: Lint
        run: npm --prefix web run lint

      - name: Typecheck
        run: npm --prefix web run typecheck

      - name: Test
        run: npm --prefix web run test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm run install:app

      - name: Install Playwright browsers
        run: npx --prefix web playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 14

  preview:
    name: Deploy PR preview
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # Same reason as the `deploy` job below: wrangler is a root
      # devDependency invoked via `npx --no-install`.
      - name: Install root dependencies
        run: npm ci

      - name: Install app dependencies
        run: npm run install:app

      - name: Build
        run: npm run build

      # A non-production --branch value makes this a Cloudflare Pages
      # *preview* deployment — left alone by the `deploy` job below, which
      # only promotes to production on --branch main. This does not reuse
      # scripts/deploy.mjs: that script hardcodes --branch main and its
      # multi-attempt stability-polling verification is tuned for
      # production, not a one-shot preview build.
      - name: Deploy preview
        run: npx --no-install wrangler pages deploy public --project-name jorna-events --branch "pr-${{ github.event.pull_request.number }}" --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const url = `https://pr-${prNumber}.jorna-events.pages.dev`;
            const marker = "<!-- pr-preview-comment -->";
            const body = `${marker}\n🔗 Preview: ${url}\n\nUses the production backend/DB — see [DEPLOY.md](../blob/main/DEPLOY.md) before exercising booking/payment flows.`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: prNumber,
                body,
              });
            }

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json

      # `wrangler` is a root-level devDependency (wrangler.jsonc lives at
      # the repo root, not in web/) and scripts/deploy.mjs invokes it via
      # `npx --no-install`, which refuses to auto-install — it only works
      # on a dev machine because a root `npm install` already happened at
      # least once (that's also what wires up husky). CI needs it explicit.
      - name: Install root dependencies
        run: npm ci

      # npm run deploy (scripts/deploy.mjs) builds, runs `wrangler pages
      # deploy`, then polls every route until it's stably serving 200 — see
      # DEPLOY.md. It exits non-zero on a bad deploy, which fails this job
      # visibly instead of leaving prod half-broken with a green Action.
      #
      # DEPLOY_DOMAIN overrides the default jornaevents.com target: that
      # zone's bot/WAF protection 403s every request from GitHub Actions'
      # runner IPs (confirmed — the wrangler upload itself succeeds, only
      # the runner's own verification fetches get blocked; the same route
      # is a clean 200 from any other network). jorna-events.pages.dev is
      # the same Cloudflare Pages deployment without that zone's WAF rules,
      # so it verifies the deploy actually went live without depending on
      # runner IPs being allowed through jornaevents.com's bot protection.
      - name: Deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_DOMAIN: https://jorna-events.pages.dev
