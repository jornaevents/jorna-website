<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Jorna</title>

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%236B1226'/><text x='50' y='72' font-size='64' font-family='Georgia,serif' fill='%23C69329' text-anchor='middle'>J</text></svg>">

<!-- Without this file Cloudflare Pages falls back to /index.html for any unknown
     path and answers 200. That is worse than cosmetic: index.html redirects into
     the app, so every typo silently became a redirect, search engines saw soft
     404s, and — the real damage — scripts/deploy.mjs verifies routes by checking
     for a 200, so a dropped route would have looked healthy. That check is the
     entire reason the deploy script exists. This file restores a real 404. -->

<style>
  :root { color-scheme: light; --ground:#F6EEE1; --ink:#35101B; --ink-soft:#6B4A45; --maroon:#6B1226; --gold:#A9791F; }
  body {
    margin:0; min-height:100dvh; display:grid; place-items:center; padding:2rem;
    background:var(--ground); color:var(--ink); text-align:center;
    font:400 17px/1.6 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif;
  }
  h1 { font-family:Georgia,serif; font-weight:500; font-size:clamp(2rem,6vw,3rem); color:var(--maroon); margin:0 0 .5rem; }
  p { color:var(--ink-soft); margin:0 0 1.75rem; }
  a { color:var(--gold); }
  .row { display:flex; flex-wrap:wrap; gap:.75rem; justify-content:center; }
  .btn {
    display:inline-block; padding:.7rem 1.3rem; border-radius:999px; text-decoration:none;
    border:1px solid color-mix(in srgb, var(--gold) 45%, transparent); color:var(--gold);
  }
  .btn:hover { border-color:var(--gold); }
</style>
</head>
<body>
  <main>
    <h1>Nothing here</h1>
    <p>That page doesn't exist — the link may be old, or slightly mistyped.</p>
    <div class="row">
      <a class="btn" href="/app/">Open Jorna</a>
      <a class="btn" href="/help/">How Jorna works</a>
    </div>
  </main>
</body>
</html>
